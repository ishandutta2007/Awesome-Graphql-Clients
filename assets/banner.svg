<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e535ab" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e535ab" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e535ab" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.55; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 0.8; }
      50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 6px #e535ab); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .node-pulse { animation: pulseNode 3s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 6 6; animation: dashLine 4s linear infinite; }
    .pill-float-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Blobs (Layered behind everything) -->
  <g opacity="0.7">
    <circle class="orb-1" cx="200" cy="80" r="160" fill="url(#glowPink)" filter="blur(40px)" />
    <circle class="orb-2" cx="1020" cy="280" r="180" fill="url(#glowViolet)" filter="blur(50px)" />
  </g>

  <!-- Dynamic GraphQL Schema Graph Lines (Background layer on the right) -->
  <g stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="880" y1="70" x2="1040" y2="120" />
    <line x1="1040" y1="120" x2="1140" y2="75" />
    <line x1="1040" y1="120" x2="1010" y2="230" />
    <line x1="1010" y1="230" x2="1140" y2="280" />
    <line x1="880" y1="70" x2="800" y2="160" />
    <line x1="800" y1="160" x2="1010" y2="230" />
  </g>
  <g fill="none" stroke="#e535ab" stroke-width="1.5" class="data-stream" stroke-opacity="0.45">
    <path d="M 750 180 Q 880 110 1010 230" />
  </g>

  <!-- Graph Schema Nodes -->
  <g fill="#8b5cf6" opacity="0.7">
    <circle cx="880" cy="70" r="5" />
    <circle cx="1140" cy="75" r="4" />
    <circle cx="800" cy="160" r="4" />
    <circle cx="1140" cy="280" r="5" />
  </g>
  <circle class="node-pulse" cx="1040" cy="120" r="6" fill="#e535ab" />
  <circle class="node-pulse" cx="1010" cy="230" r="6" fill="#38bdf8" />

  <!-- Animated Feature Badges / Cards (Right side, unobstructing) -->
  <g class="pill-float-1" transform="translate(860, 95)">
    <rect width="180" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="18" r="5" fill="#22c55e" />
    <text x="32" y="22" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Normalized Caching</text>
  </g>

  <g class="pill-float-2" transform="translate(940, 185)">
    <rect width="190" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#e535ab" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="18" r="5" fill="#e535ab" />
    <text x="32" y="22" fill="#fce7f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero-Overfetch Ready</text>
  </g>

  <g class="pill-float-1" transform="translate(850, 265)">
    <rect width="170" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="18" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Type-Safe Schema</text>
  </g>

  <!-- GraphQL Logo Geometry Decorator -->
  <g transform="translate(80, 52)">
    <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="none" stroke="#e535ab" stroke-width="2.5" opacity="0.9" />
    <circle cx="35" cy="40" r="8" fill="#e535ab" />
    <circle cx="0" cy="20" r="4" fill="#ffffff" />
    <circle cx="70" cy="20" r="4" fill="#ffffff" />
    <circle cx="70" cy="60" r="4" fill="#ffffff" />
    <circle cx="35" cy="80" r="4" fill="#ffffff" />
    <circle cx="0" cy="60" r="4" fill="#ffffff" />
    <circle cx="35" cy="0" r="4" fill="#ffffff" />
    <line x1="35" y1="0" x2="35" y2="80" stroke="#e535ab" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="20" x2="70" y2="60" stroke="#e535ab" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="60" x2="70" y2="20" stroke="#e535ab" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- FOREGROUND TEXT (Crisp, foreground, high contrast, never hidden) -->
  <text x="170" y="92" fill="#e535ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CURATED DEVELOPER DIRECTORY</text>

  <text x="80" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Awesome GraphQL Clients
  </text>

  <!-- Accent Gradient Underline -->
  <rect x="80" y="188" width="620" height="4" rx="2" fill="url(#accentGrad)" />

  <text x="80" y="230" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Top Client Libraries &amp; SaaS Platforms for Web, Mobile &amp; Backend
  </text>

  <text x="80" y="262" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Normalized Caching  •  Compile-Time Types  •  Federation &amp; Subscriptions  •  Multi-Language
  </text>

  <!-- Bottom Sub-badge -->
  <g transform="translate(80, 292)">
    <rect width="250" height="28" rx="14" fill="#030712" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#e535ab" />
    <text x="26" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Curated Ecosystem Index • 2026</text>
  </g>
</svg>
