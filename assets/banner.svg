<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d18"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#e535ab"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="glowPink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#e535ab" stop-opacity=".45"/><stop offset="100%" stop-color="#e535ab" stop-opacity="0"/></linearGradient><linearGradient id="glowViolet" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(15px,-10px);opacity:.55}}@keyframes pulseNode{0%{r:5px;opacity:.8}50%{r:8px;opacity:1;filter:drop-shadow(0 0 6px #e535ab)}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse}.node-pulse{animation:pulseNode 3s ease-in-out infinite}.data-stream{stroke-dasharray:6 6;animation:dashLine 4s linear infinite}.pill-float-1{animation:floatPill1 5s ease-in-out infinite}.pill-float-2{animation:floatPill2 6s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGradient)"/><rect width="1200" height="360" fill="url(#grid)"/><g opacity=".7"><circle cx="200" cy="8